[project]
name = "openorganoid-workers"
version = "1.0.0"
description = "Background workers for OpenOrganoid Server"
dependencies = [
    "celery>=5.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "datalad>=0.19.0",
    "pydantic>=2.5.0",
    "python-magic>=0.4.27",
    "aiofiles>=23.2.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"