[project]
name = "openorganoid-api"
version = "1.0.0"
description = "API Gateway for OpenOrganoid Server"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "gunicorn>=21.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",
    "python-magic>=0.4.27",
    "aioboto3>=12.0.0",
    "botocore>=1.32.0",
    "datalad>=0.19.0",
    "git-annex>=10.0",
    "structlog>=23.0.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "asyncio-mqtt>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]